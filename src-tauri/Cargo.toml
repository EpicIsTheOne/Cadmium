[package]
name = "cadmium"
version = "0.1.0"
description = "Cadmium desktop music workspace"
authors = ["Cadmium contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "cadmium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
lofty = "0.21"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
walkdir = "2"
