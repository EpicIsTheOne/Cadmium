[package]
name = "cadmium"
version = "0.1.0"
description = "Cadmium desktop music workspace"
authors = ["Cadmium contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "cadmium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
