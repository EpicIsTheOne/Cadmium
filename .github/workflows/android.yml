name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NDK_VERSION: "25.2.9519653"
  ANDROID_API: "34"
  GEN: src-tauri/gen/android/cadmium

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          ndk: ${{ env.NDK_VERSION }}
          packages: "platforms;android-34"

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Init Android project
        run: npm run android:init

      - name: Integrate custom Cadmium Kotlin
        run: |
          set -euo pipefail
          SRC=src-tauri/android/app/src/main
          DST=$GEN/app/src/main
          echo "DST=$DST"
          ls -la "$DST" || true
          mkdir -p "$DST/java/com/cadmium/music"
          cp -r "$SRC/java/com/cadmium/music/." "$DST/java/com/cadmium/music/"
          cp "$SRC/AndroidManifest.xml" "$DST/AndroidManifest.xml"
          echo "Kotlin integrated."

      - name: Wire Media3 + plugin deps into build.gradle.kts
        run: |
          set -euo pipefail
          GRADLE=$GEN/app/build.gradle.kts
          echo "GRADLE=$GRADLE"
          test -f "$GRADLE" || { echo "build.gradle.kts missing"; exit 1; }
          if ! grep -q "media3-exoplayer" "$GRADLE"; then
            sed -i 's#^\(\s*\)implementation("app.tauri:tauri-plugin:.*")#\1implementation("app.tauri:tauri-plugin:2.0.0")\n\1implementation("androidx.media3:media3-exoplayer:1.3.1")\n\1implementation("androidx.media3:media3-session:1.3.1")\n\1implementation("androidx.media3:media3-common:1.3.1")#' "$GRADLE"
          fi
          echo "--- patched deps ---"
          grep -n "media3\|tauri-plugin" "$GRADLE" || true

      - name: Register Cadmium plugins in MainActivity
        run: |
          set -euo pipefail
          ACT=$GEN/app/src/main/java/com/cadmium/music/MainActivity.kt
          echo "ACT=$ACT"
          test -f "$ACT" || { echo "MainActivity.kt missing"; exit 1; }
          if ! grep -q "MediaStorePlugin" "$ACT"; then
            sed -i 's#super.onCreate(savedInstanceState)#import com.cadmium.music.MediaStorePlugin\nimport com.cadmium.music.RustBridge\nsuper.onCreate(savedInstanceState)\n        add(MediaStorePlugin())\n        add(RustBridge())#' "$ACT"
          fi
          echo "--- MainActivity head ---"
          head -20 "$ACT"

      - name: Build debug APK
        run: npm run android:build:debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cadmium-android-debug
          path: |
            src-tauri/gen/android/cadmium/app/build/outputs/apk/**/*.apk
            src-tauri/target/**/build/outputs/apk/**/*.apk
          if-no-files-found: warn
