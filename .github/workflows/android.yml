name: Android APK

on:
  workflow_dispatch:
    inputs:
      custom_android:
        description: "Also integrate the custom Cadmium Media3/RustBridge Kotlin (experimental)"
        required: false
        default: "false"
  push:
    branches: [main]

permissions:
  contents: read

env:
  NDK_VERSION: "25.2.9519653"
  ANDROID_API: "34"
  GEN: src-tauri/gen/android

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          ndk: ${{ env.NDK_VERSION }}
          packages: "platforms;android-34"

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Init Android project
        run: npm run android:init

      # Custom Cadmium Kotlin (Media3 service + RustBridge). Experimental: the
      # Tauri-plugin / Media3 API wiring is still being iterated on. Flip
      # CUSTOM_ANDROID=1 (workflow_dispatch input) to attempt the full build.
      - name: Integrate custom Cadmium Kotlin (optional)
        if: ${{ inputs.custom_android == 'true' }}
        run: |
          set -euo pipefail
          SRC=src-tauri/android/app/src/main
          DST=$GEN/app/src/main
          echo "DST=$DST"
          mkdir -p "$DST/java/com/cadmium/music"
          cp -r "$SRC/java/com/cadmium/music/." "$DST/java/com/cadmium/music/"
          # NOTE: we do NOT overwrite AndroidManifest.xml — Tauri's generated
          # manifest is required for the `rust` plugin to emit TauriActivity.
          # Permissions/service attrs are patched into the generated manifest below.
          mkdir -p "$DST/res/values"
          cp -r "$SRC/res/." "$DST/res/"

      - name: Patch generated AndroidManifest (optional)
        if: ${{ inputs.custom_android == 'true' }}
        run: |
          set -euo pipefail
          MAN=$GEN/app/src/main/AndroidManifest.xml
          test -f "$MAN" || { echo "manifest missing"; exit 1; }
          # Add READ_MEDIA_AUDIO if absent.
          if ! grep -q "READ_MEDIA_AUDIO" "$MAN"; then
            sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />#' "$MAN"
          fi
          echo "--- manifest permissions ---"
          grep "uses-permission" "$MAN" | head -5

      - name: Wire Media3 deps (optional)
        if: ${{ inputs.custom_android == 'true' }}
        run: |
          set -euo pipefail
          TAURI_GRADLE=$GEN/app/tauri.build.gradle.kts
          if [ -f "$TAURI_GRADLE" ]; then
            GRADLE="$TAURI_GRADLE"
            echo "Targeting tauri.build.gradle.kts"
          else
            GRADLE=$GEN/app/build.gradle.kts
            echo "tauri.build.gradle.kts not found, using build.gradle.kts"
          fi
          test -f "$GRADLE" || { echo "build file missing"; exit 0; }
          python3 - "$GRADLE" <<'PY' || echo "media3 insert skip"
          import sys
          p = sys.argv[1]
          s = open(p).read()
          media3 = [
              'androidx.media3:media3-exoplayer:1.3.1',
              'androidx.media3:media3-session:1.3.1',
              'androidx.media3:media3-common:1.3.1',
          ]
          if 'media3-exoplayer' in s:
              print('media3 already present'); sys.exit(0)
          apply_marker = 'apply(from = "tauri.build.gradle.kts")'
          ai = s.find(apply_marker)
          if ai != -1:
              # Inside rust {} block — insert before apply() so the
              # dependencies scope is correct.
              indent = '    '
          else:
              indent = '    '
              ai = len(s)
          lines = '\n'.join(f'{indent}implementation("{d}")' for d in media3)
          block = f'\ndependencies {{\n{lines}\n}}\n'
          s = s[:ai] + block + s[ai:]
          open(p, 'w').write(s)
          print('media3 deps inserted')
          PY
          echo "--- media3 grep ---"
          grep -n "media3" "$GRADLE" || true

      # NOTE: Tauri v2 auto-registers @TauriPlugin classes at runtime; no
      # MainActivity change is needed. The earlier `add(Plugin())` approach was
      # wrong for v2 and has been removed.

      - name: Clean stale target + generated (avoids TauriActivity stale cache)
        if: ${{ inputs.custom_android == 'true' }}
        run: |
          rm -rf src-tauri/target
          rm -rf $GEN/app/src/main/java/com/cadmium/music/generated
          rm -rf $GEN/app/build

      - name: Build debug APK
        run: npm run android:build:debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cadmium-android-debug
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/target/**/build/outputs/apk/**/*.apk
          if-no-files-found: warn
