name: Android APK

on:
  workflow_dispatch:
    inputs:
      custom_android:
        description: "Also integrate the custom Cadmium Media3/RustBridge Kotlin (experimental)"
        required: false
        default: "true"
  push:
    branches: [main]

permissions:
  contents: read

env:
  NDK_VERSION: "25.2.9519653"
  ANDROID_API: "34"
  GEN: src-tauri/gen/android

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          ndk: ${{ env.NDK_VERSION }}
          packages: "platforms;android-34"

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify Android native calls use the trusted app-command bridge
        run: npx vitest run src/tests/android-native-bridge.test.ts

      - name: Init Android project
        run: npm run android:init

      # Custom Cadmium Kotlin (Media3 service + RustBridge). Experimental: the
      # Tauri-plugin / Media3 API wiring is still being iterated on. Flip
      # CUSTOM_ANDROID=1 (workflow_dispatch input) to attempt the full build.
      - name: Integrate custom Cadmium Kotlin (optional)
        if: ${{ github.event_name == 'push' || inputs.custom_android == 'true' }}
        run: |
          set -euo pipefail
          SRC=src-tauri/android/app/src/main
          DST=$GEN/app/src/main
          echo "DST=$DST"
          mkdir -p "$DST/java/com/cadmium/music"
          # Preserve Tauri's generated MainActivity.kt: it imports the generated
          # com.cadmium.music.generated.TauriActivity for the current Tauri version.
          # Our old source copy imported the removed app.tauri.TauriActivity path.
          find "$SRC/java/com/cadmium/music" -maxdepth 1 -type f -name '*.kt' ! -name 'MainActivity.kt' -exec cp {} "$DST/java/com/cadmium/music/" \;
          # NOTE: we do NOT overwrite AndroidManifest.xml — Tauri's generated
          # manifest is required for the `rust` plugin to emit TauriActivity.
          # Permissions/service attrs are patched into the generated manifest below.
          mkdir -p "$DST/res/values"
          cp -r "$SRC/res/." "$DST/res/"

      - name: Patch generated AndroidManifest (optional)
        if: ${{ github.event_name == 'push' || inputs.custom_android == 'true' }}
        run: |
          set -euo pipefail
          MAN=$GEN/app/src/main/AndroidManifest.xml
          test -f "$MAN" || { echo "manifest missing"; exit 1; }
          # Add READ_MEDIA_AUDIO if absent.
          if ! grep -q "READ_MEDIA_AUDIO" "$MAN"; then
            sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />#' "$MAN"
          fi
          if ! grep -q "READ_EXTERNAL_STORAGE" "$MAN"; then
            sed -i 's#<uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />#<uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />#' "$MAN"
          fi
          echo "--- manifest permissions ---"
          grep "uses-permission" "$MAN" | head -5

      - name: Wire Media3 deps (optional)
        if: ${{ github.event_name == 'push' || inputs.custom_android == 'true' }}
        run: |
          set -euo pipefail
          GRADLE=$GEN/app/build.gradle.kts
          test -f "$GRADLE" || { echo "build file missing"; exit 0; }
          python3 - "$GRADLE" <<'PY' || echo "media3 insert skip"
          import sys
          p = sys.argv[1]
          s = open(p).read()
          media3 = [
              'androidx.media3:media3-exoplayer:1.3.1',
              'androidx.media3:media3-session:1.3.1',
              'androidx.media3:media3-common:1.3.1',
          ]
          if 'media3-exoplayer' in s:
              print('media3 already present'); sys.exit(0)
          # Append at end of file, OUTSIDE any block, so we never
          # nest a dependencies {} inside rust {} (which corrupts
          # the rust plugin config and prevents TauriActivity gen).
          lines = '\n'.join(f'    implementation("{d}")' for d in media3)
          block = f'\ndependencies {{\n{lines}\n}}\n'
          s = s.rstrip() + '\n' + block
          open(p, 'w').write(s)
          print('media3 deps appended at end of build.gradle.kts')
          PY
          echo "--- media3 grep ---"
          grep -n "media3" "$GRADLE" || true

      # NOTE: Tauri v2 controls APK architecture via the build command's
      # --target flags (see android:build:debug in package.json), NOT via
      # build.gradle edits. Previously attempted abiFilters hack broke Gradle.

      # Native Kotlin plugins are explicitly registered from Rust in
      # src-tauri/src/android/plugins.rs via register_android_plugin(). The
      # @TauriPlugin annotation exposes commands but does NOT register a class.

      - name: Build debug APK
        run: npm run android:build:debug

      - name: Verify custom Android bridges are packaged and registered
        if: ${{ github.event_name == 'push' || inputs.custom_android == 'true' }}
        run: |
          set -euo pipefail
          APK=$(find "$GEN/app/build/outputs/apk" -name '*.apk' -print -quit)
          test -n "$APK" || { echo "APK missing"; exit 1; }
          unzip -p "$APK" 'classes*.dex' > /tmp/cadmium-classes.dex
          for cls in PermissionBridge MediaStorePlugin ArtworkBridge RustBridge; do
            grep -a -q "$cls" /tmp/cadmium-classes.dex || { echo "$cls missing from APK DEX"; exit 1; }
          done
          unzip -p "$APK" 'lib/*/libcadmium_lib.so' > /tmp/cadmium-native.so
          for plugin in permissionbridge mediastore artworkbridge rustbridge; do
            grep -a -q "$plugin" /tmp/cadmium-native.so || { echo "$plugin missing from native registration"; exit 1; }
          done
          for command in android_request_audio_permission android_native_media_store_scan android_native_play android_native_pick_audio android_import_picked; do
            grep -a -q "$command" /tmp/cadmium-native.so || { echo "$command missing from trusted Rust proxy"; exit 1; }
          done
          # The Kotlin SAF picker bridge must be compiled into the DEX.
          grep -a -q "pickAudio" /tmp/cadmium-classes.dex || { echo "MediaStorePlugin.pickAudio missing from APK DEX"; exit 1; }
          echo "All custom Android bridges are packaged and registered."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cadmium-android-debug
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/target/**/build/outputs/apk/**/*.apk
          if-no-files-found: warn
