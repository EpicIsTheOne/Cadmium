name: Android APK

on:
  workflow_dispatch:
    inputs:
      custom_android:
        description: "Also integrate the custom Cadmium Media3/RustBridge Kotlin (experimental)"
        required: false
        default: "false"
  push:
    branches: [main]

permissions:
  contents: read

env:
  NDK_VERSION: "25.2.9519653"
  ANDROID_API: "34"
  GEN: src-tauri/gen/android

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          ndk: ${{ env.NDK_VERSION }}
          packages: "platforms;android-34"

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Init Android project
        run: npm run android:init

      # Custom Cadmium Kotlin (Media3 service + RustBridge). Experimental: the
      # Tauri-plugin / Media3 API wiring is still being iterated on. Flip
      # CUSTOM_ANDROID=1 (workflow_dispatch input) to attempt the full build.
      - name: Integrate custom Cadmium Kotlin (optional)
        if: ${{ inputs.custom_android == 'true' }}
        run: |
          set -euo pipefail
          SRC=src-tauri/android/app/src/main
          DST=$GEN/app/src/main
          echo "DST=$DST"
          mkdir -p "$DST/java/com/cadmium/music"
          cp -r "$SRC/java/com/cadmium/music/." "$DST/java/com/cadmium/music/"
          cp "$SRC/AndroidManifest.xml" "$DST/AndroidManifest.xml"
          mkdir -p "$DST/res/values"
          cp -r "$SRC/res/." "$DST/res/"

      - name: Wire Media3 deps into build.gradle.kts (optional)
        if: ${{ inputs.custom_android == 'true' }}
        run: |
          set -euo pipefail
          GRADLE=$GEN/app/build.gradle.kts
          test -f "$GRADLE" || { echo "build.gradle.kts missing"; exit 1; }
          python3 - "$GRADLE" <<'PY'
          import sys, re
          p = sys.argv[1]
          s = open(p).read()
          media3 = [
              'androidx.media3:media3-exoplayer:1.3.1',
              'androidx.media3:media3-session:1.3.1',
              'androidx.media3:media3-common:1.3.1',
          ]
          if 'media3-exoplayer' in s:
              print('media3 already present'); sys.exit(0)
          # Insert the three media3 lines right after the existing
          # app.tauri:tauri-plugin dependency (do NOT modify that line).
          pat = re.compile(r'(\s*implementation\("app\.tauri:tauri-plugin:[^"]*"\))')
          m = pat.search(s)
          if not m:
              print('tauri-plugin dependency line not found!'); sys.exit(1)
          indent = m.group(1).rstrip()[:len(m.group(1))-len(m.group(1).lstrip())]
          block = '\n'.join(f'{indent}implementation("{d}")' for d in media3)
          s = s[:m.end()] + '\n' + block + s[m.end():]
          open(p,'w').write(s)
          print('media3 deps inserted')
          PY
          echo "--- deps now ---"
          grep -n "media3\|tauri-plugin" "$GRADLE" || true

      - name: Register Cadmium plugins in MainActivity (optional)
        if: ${{ inputs.custom_android == 'true' }}
        run: |
          set -euo pipefail
          ACT=$GEN/app/src/main/java/com/cadmium/music/MainActivity.kt
          test -f "$ACT" || { echo "MainActivity.kt missing"; exit 1; }
          if ! grep -q "MediaStorePlugin" "$ACT"; then
            sed -i 's#import app.tauri.TauriActivity#import app.tauri.TauriActivity\nimport com.cadmium.music.MediaStorePlugin\nimport com.cadmium.music.RustBridge#' "$ACT"
            sed -i 's#super.onCreate(savedInstanceState)#super.onCreate(savedInstanceState)\n        add(MediaStorePlugin())\n        add(RustBridge())#' "$ACT"
          fi
          head -20 "$ACT"

      - name: Build debug APK
        run: npm run android:build:debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cadmium-android-debug
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/target/**/build/outputs/apk/**/*.apk
          if-no-files-found: warn
